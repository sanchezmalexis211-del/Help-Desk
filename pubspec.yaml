name: help_desk_app_2
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '^3.11.0'

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.19.0
  cupertino_icons: ^1.0.8
  google_fonts: ^8.1.0
  lottie: ^3.3.3
  shimmer: ^3.0.0
  firebase_core: ^4.9.0
  cloud_firestore: ^6.4.1
  firebase_auth: ^6.5.1
  google_generative_ai: ^0.4.7
  firebase_messaging: ^16.3.0
  http: ^1.6.0
  googleapis_auth: ^2.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.3.13

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png

# =========================================================
# CONFIGURACIÓN DEL ÍCONO DE LA APP
# =========================================================
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.png"
  adaptive_icon_background: "#FFFFFF" 
  adaptive_icon_foreground: "assets/logo.png"

# =========================================================
# CONFIGURACIÓN DE LA PANTALLA DE CARGA
# =========================================================
flutter_native_splash:
  color: "#FFFFFF" 
  image: "assets/logo.png"
  android_12:
    image: "assets/logo.png"
    color: "#FFFFFF"